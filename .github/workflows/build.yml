name: Build and Publish

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  publish-check:
    name: Check crates.io Publish Validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish
        run: cargo publish --dry-run --all-features

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test, docs]
    env:
      STAGING_DIR: tinny-${{ matrix.target }}
      ASSET_PATH: tinny-${{ matrix.target }}.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install MUSL Tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Cross
        if: matrix.use-cross
        run: |
          mkdir -p ~/.cargo/bin
          curl -L https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
          echo "~/.cargo/bin" >> $GITHUB_PATH

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package Release Artifact
        shell: bash
        run: |
          mkdir -p "$STAGING_DIR"

          # Copy binary and metadata
          cp "target/${{ matrix.target }}/release/can" "$STAGING_DIR/"
          cp README.md LICENSE "$STAGING_DIR/"

          # Archive staging directory
          tar -czf "$ASSET_PATH" "$STAGING_DIR"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tinny-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}
          retention-days: 7

  validate-version:
    name: Validate Version Bump
    runs-on: ubuntu-latest
    needs: [release, publish-check]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to get git history/tags for validation
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Validate version against conventional commits
        run: cargo xtask validate
