[package]
name = "tinny"
version = "0.0.0"
description = "A toolkit to manage bare-metal (tin) computers."
edition = "2024"
license = "MIT"
repository = "https://github.com/harmer-dev/tinny"
documentation = "https://docs.rs/tinny"
homepage = "https://harmer-dev.github.io/tinny/"
readme = "README.md"
# keywords = []
# categories = []
exclude = [".github/"]

[features]
default = []
version-from-git = ["dep:git-cliff-core", "dep:git2", "dep:chrono"]

[dependencies]
clap = { version = "4.*", features = ["derive", "cargo", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonptr = "*"
anyhow = "*"
zeroize = "*"
secrecy = "*"
inquire = "*"
aws-lc-rs = { version = "*", features = ["prebuilt-nasm"] }
argon2 = "*"
password-hash = "0.5.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
assert_fs = "1"

[build-dependencies]
git-cliff-core = { version = "2.13.1", optional = true }
git2 = { version = "0.20", optional = true }
chrono = { version = "0.4", optional = true }

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.31.0"
ci = ["github"]
installers = []
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[workspace]
members = [
    ".",
    "xtask",
]
